spring:
  application:
    name: acuerdos-monitor-sqlite
  datasource:
    url: ${SQLITE_JDBC_URL:jdbc:sqlite:./data/acuerdos.db}
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

monitor:
  enabled: true
  cron: "0 30 15 * * MON-FRI"
  zone: America/Mexico_City
  juzgados:
    - clave: 1RG
      nombre: Rio Grande Primero Mixto
    - clave: 2RG
      nombre: Rio Grande Segundo Mixto
    - clave: 3RG
      nombre: Rio Grande Tercero Mixto

tsj:
  base-url: https://apps.pjzac.gob.mx

telegram:
  enabled: "true"
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
management:
  endpoints:
    web:
      exposure:
        include: health,info
